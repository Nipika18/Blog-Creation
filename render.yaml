services:
  # 1. The FastAPI Backend (Web Service)
  - type: web
    name: blog-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Render will provide the PORT automatically
      # We leave the secrets out of here; you will paste them in the Render Dashboard

  # 2. The React Frontend (Static Site)
  - type: web
    name: blog-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.x
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
